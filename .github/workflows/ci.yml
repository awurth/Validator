name: CI

on:
  push:
    branches: [ "6.x", "5.x" ]
  pull_request:
    branches: [ "6.x", "5.x" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none --using-cache=no

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  rector:
    name: Rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/rector process --dry-run --no-progress-bar

  tests:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        dependencies: [highest]
        include:
          - php: '8.5'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit --colors=always
